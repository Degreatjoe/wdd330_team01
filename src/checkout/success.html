<!doctype html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Sleep Outside | Order Successful
  </title>


  <link rel="stylesheet" href="/css/style.css">
  
  <link rel="stylesheet" href="/css/checkout.css">
  
</head>


<body>

  <header
    class="divider"
    id="main-header"
  ></header>


  <main class="divider">

    <section class="checkout-success">

      <div
        class="success-icon"
        aria-hidden="true"
      >
        ✓
      </div>


      <h1>
        Order Successful!
      </h1>


      <p>
        Thank you for your order.
      </p>


      <p>
        Your order has been received
        and is being processed.
      </p>


      <a
        href="/"
        class="success-button"
      >
        Continue Shopping
      </a>

    </section>

  </main>


  <footer
    id="main-footer"
  ></footer>


  <script type="module">

    import {
      loadHeaderFooter
    } from "/js/utils.mjs";

    loadHeaderFooter();

  </script>

</body>

</html>
