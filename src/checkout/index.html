<!doctype html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Sleep Outside | Checkout
  </title>

  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/checkout.css">

  <script type="module" src="/js/checkout.js"></script>

</head>


<body>

  <header
    class="divider"
    id="main-header"
  ></header>


  <main class="divider">

    <section class="products">

      <h1>
        Review &amp; Place Your Order
      </h1>

    </section>


    <section>

      <form id="checkout-form">

        <!-- CUSTOMER INFORMATION -->

        <fieldset>

          <legend>
            Customer Information
          </legend>


          <label for="fname">
            First Name
          </label>

          <input
            id="fname"
            name="fname"
            type="text"
            autocomplete="given-name"
            required
          >


          <label for="lname">
            Last Name
          </label>

          <input
            id="lname"
            name="lname"
            type="text"
            autocomplete="family-name"
            required
          >

        </fieldset>


        <!-- ADDRESS -->

        <fieldset>

          <legend>
            Address
          </legend>


          <label for="street">
            Street Address
          </label>

          <input
            id="street"
            name="street"
            type="text"
            autocomplete="street-address"
            required
          >


          <label for="city">
            City
          </label>

          <input
            id="city"
            name="city"
            type="text"
            autocomplete="address-level2"
            required
          >


          <label for="state">
            State
          </label>

          <input
            id="state"
            name="state"
            type="text"
            autocomplete="address-level1"
            required
          >


          <label for="zip">
            Zip Code
          </label>

          <input
            id="zip"
            name="zip"
            type="text"
            inputmode="numeric"
            autocomplete="postal-code"
            required
          >

        </fieldset>


        <!-- PAYMENT -->

        <fieldset>

          <legend>
            Payment
          </legend>


          <label for="cardNumber">
            Credit Card Number
          </label>

          <input
            id="cardNumber"
            name="cardNumber"
            type="text"
            inputmode="numeric"
            autocomplete="cc-number"
            required
          >


          <label for="expiration">
            Expiration Date
          </label>

          <input
            id="expiration"
            name="expiration"
            type="text"
            placeholder="MM/YY"
            autocomplete="cc-exp"
            required
          >


          <label for="code">
            Security Code
          </label>

          <input
            id="code"
            name="code"
            type="text"
            inputmode="numeric"
            autocomplete="cc-csc"
            required
          >

        </fieldset>


        <!-- SUBMIT BUTTON -->

        <button
          id="checkoutSubmit"
          type="submit"
        >
          Checkout
        </button>

      </form>

    </section>


    <!-- ORDER SUMMARY -->

    <section class="order-summary">

      <h2>
        Order Summary
      </h2>


      <p>
        <span>
          Subtotal:
        </span>

        <span id="subtotal">
          $0.00
        </span>
      </p>


      <p>
        <span>
          Tax:
        </span>

        <span id="tax">
          $0.00
        </span>
      </p>


      <p>
        <span>
          Shipping:
        </span>

        <span id="shipping">
          $0.00
        </span>
      </p>


      <p>
        <span>
          Order Total:
        </span>

        <strong id="order-total">
          $0.00
        </strong>
      </p>

    </section>


    <p
      id="checkout-message"
      aria-live="polite"
    ></p>

  </main>


  <footer
    id="main-footer"
  ></footer>

</body>

</html>
