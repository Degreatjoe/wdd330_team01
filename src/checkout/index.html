<!doctype html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Sleep Outside | Checkout</title>

  <link rel="stylesheet" href="/css/style.css">
  
  <link rel="stylesheet" href="/css/checkout.css">

  <script type="module" src="/js/checkout.js"></script>

</head>


<body>

  <header
    class="divider"
    id="main-header"
  ></header>


  <main class="divider">

    <section class="products">

      <h1>
        Review & Place Your Order
      </h1>

    </section>


    <section>

      <form id="checkout-form">

        <fieldset>

          <legend>
            Customer Information
          </legend>


          <label for="fname">
            First Name
          </label>

          <input
            id="fname"
            name="fname"
            type="text"
            required
          >


          <label for="lname">
            Last Name
          </label>

          <input
            id="lname"
            name="lname"
            type="text"
            required
          >

        </fieldset>


        <fieldset>

          <legend>
            Address
          </legend>


          <label for="street">
            Street Address
          </label>

          <input
            id="street"
            name="street"
            type="text"
            required
          >


          <label for="city">
            City
          </label>

          <input
            id="city"
            name="city"
            type="text"
            required
          >


          <label for="state">
            State
          </label>

          <input
            id="state"
            name="state"
            type="text"
            required
          >


          <label for="zip">
            Zip Code
          </label>

          <input
            id="zip"
            name="zip"
            type="text"
            required
          >

        </fieldset>


        <fieldset>

          <legend>
            Payment
          </legend>


          <label for="cardNumber">
            Credit Card Number
          </label>

          <input
            id="cardNumber"
            name="cardNumber"
            type="text"
            required
          >


          <label for="expiration">
            Expiration Date
          </label>

          <input
            id="expiration"
            name="expiration"
            type="text"
            placeholder="MM/YY"
            required
          >


          <label for="code">
            Security Code
          </label>

          <input
            id="code"
            name="code"
            type="text"
            required
          >

        </fieldset>


        <button type="submit">
          Checkout
        </button>

      </form>

    </section>


    <section class="order-summary">

      <h2>
        Order Summary
      </h2>


      <p>
        Subtotal:
        <span id="subtotal">
          $0.00
        </span>
      </p>


      <p>
        Tax:
        <span id="tax">
          $0.00
        </span>
      </p>


      <p>
        Shipping:
        <span id="shipping">
          $0.00
        </span>
      </p>


      <p>
        Order Total:
        <strong id="order-total">
          $0.00
        </strong>
      </p>

    </section>


    <p id="checkout-message"></p>

  </main>


  <footer
    id="main-footer"
  ></footer>

</body>

</html>
